<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ app_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Parkinsans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#26221d; --muted:#6f675c; --rule:#e4dfd6; --paper:#ffffff; --brand:#d6632f;
          --brand-dark:#b34f21; --hold:#fbf1e8; --ok:#e8f4ec; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
         font:16px/1.5 Parkinsans, "Segoe UI", system-ui, sans-serif; }
  a { color:var(--brand-dark); }
  header { display:flex; align-items:baseline; gap:1.2rem; padding:1.2rem 1.5rem;
           border-bottom:1px solid var(--rule); }
  header .name { font-weight:600; font-size:1.05rem; text-decoration:none; color:var(--ink); }
  header .who { color:var(--muted); font-size:.9rem; margin-left:auto; }
  main { max-width: 68rem; margin: 0 auto; padding: 1.5rem; }
  h1 { font-size:1.75rem; font-weight:500; line-height:1.25; margin:.4rem 0 1.2rem; max-width:40ch; }
  h2 { font-size:1.05rem; font-weight:600; margin:2rem 0 .6rem; }
  p { max-width:70ch; }
  .quiet { color:var(--muted); }
  .flash { background:var(--hold); padding:.7rem 1rem; border-radius:6px; margin-bottom:1rem; }
  button, .btn { font:inherit; font-weight:500; padding:.55rem 1rem; border-radius:6px; cursor:pointer;
                 border:1px solid var(--rule); background:#fff; color:var(--ink); text-decoration:none; }
  button.primary, .btn.primary { background:var(--brand); border-color:var(--brand); color:#fff; }
  button.primary:hover, .btn.primary:hover { background:var(--brand-dark); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible
    { outline:2px solid var(--brand); outline-offset:2px; }
  form.inline { display:inline; }
  .runbar { display:flex; flex-wrap:wrap; gap:.8rem 1.2rem; align-items:center; margin:1rem 0 1.5rem; }
  .runbar label { color:var(--muted); font-size:.9rem; }
  .runbar input[type=number] { width:4.5rem; font:inherit; padding:.35rem .5rem; border:1px solid var(--rule); border-radius:6px; }
  table { width:100%; border-collapse:collapse; font-size:.95rem; }
  th { text-align:left; font-weight:500; color:var(--muted); padding:.4rem .6rem; border-bottom:1px solid var(--rule); }
  td { padding:.55rem .6rem; border-bottom:1px solid var(--rule); vertical-align:top; }
  tr.done td { color:var(--muted); }
  .note { color:var(--muted); font-size:.85rem; }
  .held li { padding:.6rem 0; border-bottom:1px solid var(--rule); }
  .held select { font:inherit; padding:.3rem .4rem; border:1px solid var(--rule); border-radius:6px; }
  dl.fields { display:grid; grid-template-columns: 14rem 1fr; gap:.35rem 1rem; margin:1rem 0; max-width:60rem; }
  dl.fields dt { color:var(--muted); }
  dl.fields dd { margin:0; word-break:break-word; }
  .actions { display:flex; flex-wrap:wrap; gap:.8rem; align-items:center; margin:1.5rem 0; }
  @media (max-width: 640px) { dl.fields { grid-template-columns:1fr; } td, th { padding:.4rem .3rem; } }
  @media (prefers-reduced-motion: no-preference) { button.primary { transition: background .15s; } }
</style>
</head>
<body>
<header>
  <a class="name" href="/">{{ app_name }}</a>
  {% if user and user != 'local' %}<span class="who">{{ user }} · <a href="/logout">Sign out</a></span>{% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
