[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alora-evv"
version = "0.1.0"
description = "Alora EVV adjustment assistant (Mobile Caregiver+ -> state adjustment form)"
requires-python = ">=3.11"
dependencies = [
    "playwright==1.56.0",   # keep in step with deploy/Dockerfile
    "keyring>=24",
    "pyyaml>=6",
    "platformdirs>=4",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "authlib>=1.3", "itsdangerous>=2",
       "jinja2>=3.1", "python-multipart>=0.0.9", "httpx>=0.27"]
dev = ["pytest>=8", "pyflakes>=3", "alora-evv[web]"]

[project.scripts]
alora-evv = "alora_evv.cli:main"

[tool.setuptools]
packages = ["alora_evv", "alora_evv.web"]

[tool.setuptools.package-data]
"alora_evv.web" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
