</div>
<script>
document.querySelectorAll('input.combo').forEach(el => el.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const opts = el.dataset.options.split('|');
    const hit = opts.find(o => o.toLowerCase().includes(el.value.toLowerCase()));
    if (hit) el.value = hit;
  }
}));
</script></body></html>
